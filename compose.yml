x-database-url: &database-url postgresql://${POSTGRES_USER:-jerry}:${POSTGRES_PASSWORD:-jerry}@postgres:5432/jerry

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-jerry}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-jerry}"
      POSTGRES_DB: jerry
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d jerry"]
      interval: 2s
      timeout: 3s
      retries: 20

  jerry:
    build:
      context: .
      target: dev
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: *database-url
    ports:
      - "127.0.0.1:3000:3000"
    develop:
      watch:
        - { action: sync, path: ./app, target: /app/app }
        - { action: sync, path: ./public, target: /app/public }
        - { action: sync, path: ./server.mjs, target: /app/server.mjs }
        - { action: rebuild, path: package.json }
        - { action: rebuild, path: package-lock.json }
        - { action: sync+restart, path: ./migrations, target: /app/migrations }
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
